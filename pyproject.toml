[project]
name = "extract-emails"
version = "6.2.0"
requires-python = ">=3.10,<3.15"
description = "Extract email addresses and linkedin profiles from given URL."
authors = [
  {name = "Dmitrii K", email = "dmitriik@proton.me"}
]
readme = "README.md"
keywords = ["parser", "email", "linkedin"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: Unix",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Utilities",
]
dependencies = [
    "aiocsv>=1.4.1",
    "aiofiles>=25.1.0",
    "click>=8.1",
    "loguru>=0.7.3",
    "lxml>=6.1.3",
    "pydantic>=2.14.1",
]

[project.urls]
repository = "https://github.com/dmitriiweb/extract-emails"
documentation = "https://dmitriiweb.github.io/extract-emails"

[project.optional-dependencies]
all = [
    "httpx>=0.28.1",
    "playwright>=1.64.0",
] 
httpx = [
    "httpx>=0.28.1",
]
playwright = [
    "playwright>=1.64.0",
]
dev = [
    "jinja2>=3.1.6",
    "lxml-stubs>=0.5.1",
    "mkdocs>=1.6.1",
    "mkdocs-autorefs>=1.4.4",
    "mkdocs-copy-to-llm>=0.2.10",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "mypy>=2.4.0",
    "pygments>=2.21.0",
    "pytest>=9.1.1",
    "pytest-async>=0.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "tox>=4.65.0",
    "types-aiofiles>=25.1.0.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
extract-emails = "extract_emails.console.application:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "C90", "E4", "E7", "E9", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 24

[tool.uv]
exclude-newer = "1 week"
