[tox]
isolated_build = True
envlist = py310,py311,py312,py313,py314
skip_missing_interpreters = True

[testenv]
extras = dev,all
commands =
    pytest -m "not slow" tests/

[testenv:browsers]
description = Browser smoke tests; Chromium must already be installed.
extras = dev,all
commands =
    pytest tests/browsers/
